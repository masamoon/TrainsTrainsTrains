<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#26332e" />
    <meta name="description" content="Lay track and set signals to bring every train home. A campaign of stops and a new Daily Line every day." />
    <title>TrainsTrainsTrains</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/BarlowCondensed-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      // Pages caches index.html for ~10 minutes, so right after a deploy the
      // browser can hold a page whose hashed bundle no longer exists. When a
      // bundle fails to load, refetch the page past the cache and reload once.
      addEventListener(
        "error",
        function (e) {
          var el = e.target;
          if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return;
          if (!/\/assets\//.test(el.src || el.href || "")) return;
          try {
            if (sessionStorage.getItem("ttt.staleReload")) return;
            sessionStorage.setItem("ttt.staleReload", "1");
          } catch (_) {
            return;
          }
          fetch(location.href, { cache: "reload" }).finally(function () {
            location.reload();
          });
        },
        true,
      );
      addEventListener("load", function () {
        setTimeout(function () {
          try {
            sessionStorage.removeItem("ttt.staleReload");
          } catch (_) {}
        }, 5000);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
